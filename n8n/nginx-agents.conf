# Nginx reverse proxy config for agents.haxe.ai
# Live file: /etc/nginx/conf.d/agents.conf on the VPS
# The live file is managed by certbot (TLS blocks added/updated automatically).
# This copy reflects the post-certbot state for reference; do not hand-edit
# the live file's certbot-managed sections.

server {
    server_name agents.haxe.ai;

    location / {
        proxy_pass http://localhost:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        chunked_transfer_encoding on;
        proxy_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agents.haxe.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agents.haxe.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = agents.haxe.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name agents.haxe.ai;
    return 404; # managed by Certbot
}
