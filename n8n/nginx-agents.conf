# Nginx reverse proxy config for agents.skalus.com
# Live file: /etc/nginx/conf.d/agents.conf on the VPS
# The live file is managed by certbot (TLS blocks added/updated automatically).
# This copy reflects the post-cutover state for reference; do not hand-edit
# the live file's certbot-managed sections.
#
# History: this vhost served agents.haxe.ai until the 2026-07-03 hard cutover to
# agents.skalus.com (ADR-070, supersedes ADR-012). During the cutover both names
# were served in parallel; the agents.haxe.ai server blocks + cert were removed at
# the end (Block 6 decommission). This reference shows the final skalus.com-only state.

server {
    server_name agents.skalus.com;

    location / {
        proxy_pass http://localhost:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        chunked_transfer_encoding on;
        proxy_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agents.skalus.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agents.skalus.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = agents.skalus.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name agents.skalus.com;
    return 404; # managed by Certbot
}
