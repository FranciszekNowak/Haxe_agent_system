# LiteLLM gateway config (ADR-024). Committed — contains NO secrets.
# AWS credentials, region, and the master key are injected from the VPS .env as
# environment variables (see docker-compose.yml `litellm` service + .env.example).
#
# `model_name` is the alias n8n sends as the "model" field; the Supabase
# `model_routing` table stores these alias names (not raw Bedrock IDs), so swapping
# the underlying profile (e.g. Opus 4.5 -> 4.8 once access is granted) is a one-line
# change here, not a data migration. EU-resident inference profiles only (GDPR, ADR-002).
#
# NOTE (verify on first deploy): the `bedrock/<inference-profile-id>` string format
# for cross-region EU profiles must be smoke-tested — same discipline as ADR-021/023.

model_list:
  - model_name: haxe-haiku
    litellm_params:
      model: bedrock/eu.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
  - model_name: haxe-sonnet
    litellm_params:
      model: bedrock/eu.anthropic.claude-sonnet-4-6
      aws_region_name: os.environ/AWS_REGION_NAME
  - model_name: haxe-opus
    litellm_params:
      model: bedrock/eu.anthropic.claude-opus-4-5-20251101-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME

litellm_settings:
  drop_params: true          # ignore provider-unsupported params instead of erroring

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
