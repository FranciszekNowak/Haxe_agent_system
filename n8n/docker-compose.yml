services:
  n8n-postgres:
    image: postgres:16
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    networks:
      - n8n-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n-redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - n8n-redis-data:/data
    networks:
      - n8n-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n-main:
    image: n8nio/n8n:2.22.5
    container_name: n8n-main
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: "6379"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}   # makes execution links in alerts clickable (ADR-025)
      WEBHOOK_URL: ${WEBHOOK_URL}                   # public base for generated webhook/form URLs (ADR-012)
    volumes:
      - n8n-main-data:/home/node/.n8n
    networks:
      - n8n-internal
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy

  n8n-worker:
    image: n8nio/n8n:2.22.5
    container_name: n8n-worker
    restart: unless-stopped
    command: worker
    environment:
      N8N_EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: "6379"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}
      N8N_CONCURRENCY_PRODUCTION_LIMIT: ${N8N_WORKER_CONCURRENCY}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}   # execution links in alerts (ADR-025)
      WEBHOOK_URL: ${WEBHOOK_URL}                   # public base for generated webhook/form URLs (ADR-012)
    networks:
      - n8n-internal
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy

  # LiteLLM gateway — single front door for model calls (ADR-024). Internal only:
  # only n8n reaches it at http://litellm:4000. Signs Bedrock correctly and returns
  # exact token usage (which the native n8n node swallows). Config in litellm-config.yaml.
  litellm:
    image: ghcr.io/berriai/litellm@sha256:75543fa1d73989b7aefba49c910989f7886f63210520e30b39dbbc580a41826f  # LiteLLM v1.87.0, pinned by digest 2026-06-03 (ADR-011)
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"   # loopback only (SSH-tunnel for debugging); never public
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION_NAME: ${AWS_REGION_NAME}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}   # direct API (non-GDPR tasks, ADR-030)
      TAVILY_API_KEY: ${TAVILY_API_KEY}         # web search backend (ADR-034)
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    networks:
      - n8n-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  n8n-postgres-data:
  n8n-redis-data:
  n8n-main-data:

networks:
  n8n-internal:
    driver: bridge
