services:
  n8n-postgres:
    image: postgres:16
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    networks:
      - n8n-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n-redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - n8n-redis-data:/data
    networks:
      - n8n-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n-main:
    image: n8nio/n8n:2.22.5
    container_name: n8n-main
    restart: unless-stopped
    # Memory hardening (ADR-051 Block 6): on this 8 GB box Docling wants ≥4 GB when loaded, so an
    # unbounded n8n process (Node's default heap ceiling here is ~2.2 GB) could crowd it out. mem_limit
    # is the cgroup ceiling; NODE_OPTIONS heap ceiling sits BELOW it so a runaway hits a JS heap OOM
    # (fails its own execution, container restarts) instead of the kernel OOM-killing Docling.
    mem_limit: 1024m
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"
      N8N_EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: "6379"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}   # makes execution links in alerts clickable (ADR-025)
      WEBHOOK_URL: ${WEBHOOK_URL}                   # public base for generated webhook/form URLs (ADR-012)
      # Execution-data pruning (ADR-036 Block 10): base64 images ride in execution data, so bound it.
      # Prune deletes historical execution records (node I/O) older than MAX_AGE or beyond MAX_COUNT.
      # Durable business record lives in Supabase agent_runs (NOT pruned); this only GCs n8n's debug payload.
      EXECUTIONS_DATA_PRUNE: "true"                 # default true; explicit
      EXECUTIONS_DATA_MAX_AGE: "168"                # hours = 7 days (was n8n default 336 = 14 days)
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "5000"       # keep at most 5000 executions (was default 10000)
      # Task-runner task timeout (ADR-051 Block 7): the default 300s killed the parallel image batch
      # (Generate Images Parallel) mid-flight and surfaced it as a CRITICAL. Raised to 900s (15 min) to
      # fit 2 full gpt-image-2 waves (~176s/image, cap 5 = 10 images). The batch Code node carries an
      # internal soft-deadline (840s) that returns partial results gracefully BELOW this hard ceiling.
      # GLOBAL: applies to every Code-node task; the image batch is the only long-running one.
      N8N_RUNNERS_TASK_TIMEOUT: "900"
    volumes:
      - n8n-main-data:/home/node/.n8n
    networks:
      - n8n-internal
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy

  n8n-worker:
    image: n8nio/n8n:2.22.5
    container_name: n8n-worker
    restart: unless-stopped
    command: worker
    # Memory hardening (ADR-051 Block 6): image generation runs HERE (the parallel batch's base64 images
    # ride execution data), so the worker is the runaway risk. Same scheme as n8n-main: mem_limit cgroup
    # ceiling + a lower NODE_OPTIONS heap ceiling, sized to leave Docling its 4 GB on the 8 GB host.
    mem_limit: 1024m
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"
      N8N_EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: "6379"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}
      N8N_CONCURRENCY_PRODUCTION_LIMIT: ${N8N_WORKER_CONCURRENCY}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}   # execution links in alerts (ADR-025)
      WEBHOOK_URL: ${WEBHOOK_URL}                   # public base for generated webhook/form URLs (ADR-012)
      EXECUTIONS_DATA_PRUNE: "true"                 # pruning runs on main; set here too for parity (ADR-036 Block 10)
      EXECUTIONS_DATA_MAX_AGE: "168"                # hours = 7 days
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "5000"
      # Task-runner task timeout (ADR-051 Block 7): image generation runs HERE, so this is the binding
      # ceiling for the parallel batch. 900s (was default 300s) fits 2 full gpt-image-2 waves; the batch
      # Code node's 840s internal soft-deadline degrades gracefully below it. See n8n-main for detail.
      N8N_RUNNERS_TASK_TIMEOUT: "900"
    networks:
      - n8n-internal
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy

volumes:
  n8n-postgres-data:
  n8n-redis-data:
  n8n-main-data:

networks:
  n8n-internal:
    driver: bridge
